<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Sinais Vitais - ESP32</title>
<style>
body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; margin: 0; }
.card-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 24px; }
.card { background: #1e293b; padding: 20px; border-radius: 12px; width: 200px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.value { font-size: 2.5em; font-weight: bold; color: #38bdf8; margin: 10px 0; }
.status { font-size: 0.9em; color: #94a3b8; }
.alert { color: #f87171; }
.charts { max-width: 1000px; margin: 30px auto 0; display: flex; flex-direction: column; gap: 20px; }
.chart-box { background: #1e293b; border-radius: 12px; padding: 12px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left; }
.chart-box h3 { margin: 0 0 8px; font-size: 1em; display: flex; justify-content: space-between; }
.chart-box h3 span { font-weight: normal; color: #94a3b8; font-size: 0.85em; }
canvas { width: 100%; height: 180px; display: block; background: #0b1220; border-radius: 8px; }
</style>
</head>
<body>
<h1>Monitor de Sinais Vitais</h1>
<div id="connection" class="status">Desconectado</div>

<div class="card-container">
  <div class="card">
    <h3>ECG (BPM)</h3>
    <div id="bpmECG" class="value">--</div>
    <div id="ecgStatus" class="status">Aguardando...</div>
  </div>
  <div class="card">
    <h3>PPG (BPM)</h3>
    <div id="bpmPPG" class="value">--</div>
    <div id="ppgStatus" class="status">Aguardando...</div>
  </div>
  <div class="card">
    <h3>SpO2</h3>
    <div id="spo2" class="value">-- %</div>
    <div id="spo2Status" class="status">Aguardando...</div>
  </div>
  <div class="card">
    <h3>Temperatura</h3>
    <div id="temp" class="value">-- °C</div>
    <div id="tempStatus" class="status">Aguardando...</div>
  </div>
</div>

<div class="charts">
  <div class="chart-box">
    <h3>ECG Filtrado <span id="ecgScale">--</span></h3>
    <canvas id="ecgCanvas"></canvas>
  </div>
  <div class="chart-box">
    <h3>PPG (Oximetria - IR) <span id="ppgScale">--</span></h3>
    <canvas id="ppgCanvas"></canvas>
  </div>
</div>

<script>
class Chart {
  constructor(canvas, { size, color, minSpan, scaleEl, unit }) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.size = size;
    this.color = color;
    this.minSpan = minSpan;
    this.scaleEl = scaleEl;
    this.unit = unit;
    this.buf = new Float32Array(size);
    this.head = 0;
    this.count = 0;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = this.cv.getBoundingClientRect();
    this.cv.width = Math.max(1, Math.round(r.width * dpr));
    this.cv.height = Math.max(1, Math.round(r.height * dpr));
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = r.width; this.h = r.height;
  }
  push(v) {
    this.buf[this.head] = v;
    this.head = (this.head + 1) % this.size;
    if (this.count < this.size) this.count++;
  }
  clear() { this.count = 0; this.head = 0; }
  draw() {
    const { ctx, w, h, size, count } = this;
    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = '#1e2a44'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
    ctx.stroke();

    if (count < 2) {
      ctx.fillStyle = '#64748b'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
      ctx.fillText('Aguardando dados...', w / 2, h / 2 + 5);
      return;
    }

    let mn = Infinity, mx = -Infinity;
    const start = (this.head - count + size) % size;
    for (let i = 0; i < count; i++) {
      const v = this.buf[(start + i) % size];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    
    const mid = (mn + mx) / 2;
    const span = Math.max(mx - mn, this.minSpan) * 1.2;
    const lo = mid - span / 2;
    const range = span || 1;
    const pxPerSample = w / (size - 1);

    ctx.strokeStyle = this.color; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const v = this.buf[(start + i) % size];
      const x = i * pxPerSample;
      const y = h - ((v - lo) / range) * (h - 20) - 10;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    if (this.scaleEl) {
      this.scaleEl.textContent = `${range.toFixed(1)} ${this.unit} p/p`;
    }
  }
}

// Gráfico de ECG (tamanho maior para acomodar 250Hz / taxa de fluxo)
const ecgChart = new Chart(document.getElementById('ecgCanvas'), {
  size: 250, color: '#4ade80', minSpan: 5,
  scaleEl: document.getElementById('ecgScale'), unit: 'mV'
});

// Gráfico de PPG (Oximetria)
const ppgChart = new Chart(document.getElementById('ppgCanvas'), {
  size: 200, color: '#38bdf8', minSpan: 100,
  scaleEl: document.getElementById('ppgScale'), unit: 'units'
});

(function loop() {
  ecgChart.draw();
  ppgChart.draw();
  requestAnimationFrame(loop);
})();

const connEl = document.getElementById('connection');
const bpmEcgEl = document.getElementById('bpmECG');
const ecgStatusEl = document.getElementById('ecgStatus');
const bpmPpgEl = document.getElementById('bpmPPG');
const ppgStatusEl = document.getElementById('ppgStatus');
const spo2El = document.getElementById('spo2');
const tempEl = document.getElementById('temp');
const tempStatusEl = document.getElementById('tempStatus');

function handleJson(data) {
  if (data.leadoff) {
    bpmEcgEl.innerText = "--";
    ecgStatusEl.innerText = "Eletrodos desconectados";
    ecgStatusEl.classList.add('alert');
    ecgChart.clear();
  } else {
    bpmEcgEl.innerText = data.bpmECG > 0 ? data.bpmECG.toFixed(1) : "--";
    ecgStatusEl.innerText = data.bpmECG > 0 ? "Leitura normal" : "Detectando...";
    ecgStatusEl.classList.remove('alert');
  }

  if (!data.fingerPresent) {
    bpmPpgEl.innerText = "--";
    spo2El.innerText = "-- %";
    ppgStatusEl.innerText = "Dedo ausente";
    ppgStatusEl.classList.add('alert');
    ppgChart.clear();
  } else {
    ppgStatusEl.classList.remove('alert');
    bpmPpgEl.innerText = data.bpmPPGValid ? data.bpmPPG : "--";
    ppgStatusEl.innerText = data.bpmPPGValid ? "Leitura OK" : "Calculando...";
    spo2El.innerText = data.spo2Valid ? `${data.spo2}%` : "-- %";
  }

  if (data.tempValid) {
    tempEl.innerText = `${data.tempC.toFixed(1)} °C`;
    tempStatusEl.innerText = "Leitura OK";
    tempStatusEl.classList.remove('alert');
  } else {
    tempEl.innerText = "-- °C";
    tempStatusEl.innerText = "Sensor sem leitura";
    tempStatusEl.classList.add('alert');
  }
}

function connect() {
  const socket = new WebSocket(`ws://${location.host}/ws`);

  socket.onopen = () => {
    connEl.innerText = "Conectado ao ESP32 em tempo real";
    connEl.style.color = "#4ade80";
  };
  socket.onclose = () => {
    connEl.innerText = "Conexão perdida. Reconectando...";
    connEl.style.color = "#f87171";
    setTimeout(connect, 2000);
  };
  socket.onmessage = (event) => {
    try { 
      const data = JSON.parse(event.data);
      if (data.w === 1) {
        if (data.ecg) {
          for (let i = 0; i < data.ecg.length; i++) ecgChart.push(data.ecg[i]);
        }
        if (data.ir) {
          for (let i = 0; i < data.ir.length; i++) ppgChart.push(data.ir[i]);
        }
      } else {
        handleJson(data);
      }
    } catch (e) { 
      console.error("Erro ao processar JSON:", e); 
    }
  };
}
connect();
</script>
</body>
</html>
